name: Build KMP iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configurar Ambiente e Diretórios
        run: |
          chmod +x ./gradlew
          echo "export JAVA_HOME=$JAVA_HOME" > iosApp/.xcode.env
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 1. Compilar o código Kotlin (Gera o framework)
        run: ./gradlew :shared:assembleSharedDebugXCFramework

      - name: Injeção de Código - Destruir Ciclo do Xcode
        run: |
          gem install xcodeproj --no-document
          ruby -e "
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('iosApp/iosApp.xcodeproj')
          target = proj.targets.first
          
          # Varre o projeto e DELETA qualquer script de compilação embutido
          scripts = target.build_phases.select { |p| p.class.to_s.include?('PBXShellScriptBuildPhase') }
          scripts.each { |s| target.build_phases.delete(s) }
          
          proj.save
          puts 'Fase de script redundante deletada. Ciclo destruído na raiz.'
          "

      - name: 2. Compilar o Projeto Xcode (App iOS)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
