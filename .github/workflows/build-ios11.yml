name: Build KMP iOS (Dispositivo Físico)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configurar Ambiente e Diretórios
        run: |
          chmod +x ./gradlew
          echo "export JAVA_HOME=$JAVA_HOME" > iosApp/.xcode.env
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 1. Compilar o código Kotlin (Gera o framework)
        run: ./gradlew :shared:assembleSharedDebugXCFramework

      - name: Injeção de Código - Destruir Ciclo do Xcode
        run: |
          gem install xcodeproj --no-document
          ruby -e "
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('iosApp/iosApp.xcodeproj')
          target = proj.targets.first
          scripts = target.build_phases.select { |p| p.class.to_s.include?('PBXShellScriptBuildPhase') }
          scripts.each { |s| target.build_phases.delete(s) }
          proj.save
          puts 'Fase de script redundante deletada. Ciclo destruído na raiz.'
          "

      # --- NOVAS ETAPAS PARA DISPOSITIVO FÍSICO ---

      - name: 2. Instalar Certificados da Apple
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APP_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APP_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Define caminhos temporários
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decodifica os arquivos em base64 vindos do GitHub Secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Cria uma keychain temporária na máquina do GitHub
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Importa o certificado para a keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Aplica o provisioning profile no sistema
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: 3. Gerar o Archive (Xcode)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            clean archive | xcbeautify

      - name: 4. Exportar para .ipa
        env:
          EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist
          echo -n "$EXPORT_OPTIONS_PLIST" | base64 --decode -o $EXPORT_OPTS_PATH

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -exportOptionsPlist $EXPORT_OPTS_PATH \
            -exportPath $RUNNER_TEMP/export | xcbeautify

      - name: 5. Fazer Upload do .ipa gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: ${{ runner.temp }}/export/iosApp.ipa
