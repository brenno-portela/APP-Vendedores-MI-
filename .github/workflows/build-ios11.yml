name: Build KMP iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configurar Ambiente e Diretórios
        run: |
          chmod +x ./gradlew
          echo "export JAVA_HOME=$JAVA_HOME" > iosApp/.xcode.env
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 1. Compilar o código Kotlin (Shared XCFramework)
        run: ./gradlew :shared:assembleSharedDebugXCFramework

      - name: Injeção de Código - Corrigir Ciclo do Xcode 15
        run: |
          gem install xcodeproj --no-document
          ruby -e "
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('iosApp/iosApp.xcodeproj')
          target = proj.targets.first
          phase = target.build_phases.find { |p| p.class.to_s.include?('PBXShellScriptBuildPhase') }
          if phase
            target.build_phases.delete(phase)
            target.build_phases.insert(0, phase)
            proj.save
            puts 'Script KMP movido para o topo da fila com sucesso!'
          end
          "

      - name: 2. Compilar o Projeto Xcode (App iOS)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
